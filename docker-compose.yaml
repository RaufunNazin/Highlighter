services:
  backend:
    build: ./backend
    container_name: highlighter_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - redis

  celery_worker:
    build: ./backend
    container_name: highlighter_celery_worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - redis
    command: celery -A app.celery_app worker --loglevel=info

  redis:
    image: redis:alpine
    container_name: highlighter_redis
    restart: always
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    container_name: highlighter_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
